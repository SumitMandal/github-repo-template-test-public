name: CI

on:
  pull_request:
  push:
    branches: [main, stage, develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job name is a required status check in .github/rulesets/. Rename both together.
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check shell scripts
        run: |
          for f in githooks/* scripts/*.sh; do bash -n "$f"; done

      # Node.js projects: the package manager is picked from the lockfile.
      # A package.json without a lockfile fails, rather than passing without testing.
      - name: Detect Node package manager
        id: node
        if: hashFiles('package.json') != ''
        run: |
          if   [ -f pnpm-lock.yaml ];    then echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ];         then echo "pm=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then echo "pm=npm"  >> "$GITHUB_OUTPUT"
          else
            echo "::error::package.json has no lockfile. Commit package-lock.json, yarn.lock or pnpm-lock.yaml."
            exit 1
          fi
          # Without packageManager, Corepack picks its own default yarn/pnpm version,
          # which may not read the committed lockfile.
          if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
            if ! grep -q '"packageManager"' package.json; then
              echo "::error::Add a \"packageManager\" field to package.json (for example \"pnpm@9.15.0\") so CI installs the version that wrote your lockfile."
              exit 1
            fi
          fi
      - name: Enable Corepack for yarn and pnpm
        if: steps.node.outputs.pm == 'yarn' || steps.node.outputs.pm == 'pnpm'
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.node.outputs.pm != ''
        with:
          node-version: 22
          cache: ${{ steps.node.outputs.pm }}
      - name: Node lint and test
        if: steps.node.outputs.pm != ''
        env:
          PM: ${{ steps.node.outputs.pm }}
        run: |
          case "$PM" in
            npm)  npm ci ;;
            yarn) if [ "$(yarn --version | cut -d. -f1)" -ge 2 ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
            pnpm) pnpm install --frozen-lockfile ;;
          esac
          has_script() { node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$1"; }
          if has_script lint; then "$PM" run lint; fi
          if has_script test; then "$PM" test; fi

      # Python projects: runs only when pyproject.toml or requirements.txt exists.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        with:
          python-version: "3.12"
      - name: Python lint and test
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
          pip install ruff pytest
          ruff check .
          pytest || [ $? -eq 5 ]  # exit code 5 = no tests collected
