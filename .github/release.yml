# Groups the auto-generated release notes by label.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Breaking changes
      labels: ["breaking-change"]
    - title: Features
      labels: ["type: feature"]
    - title: Bug fixes
      labels: ["type: bug"]
    - title: Documentation
      labels: ["type: docs"]
    - title: Maintenance
      labels: ["type: chore", "dependencies"]
    - title: Other changes
      labels: ["*"]
